  <style>
.bk-ft-wrap{margin:0 0 44px}
.bk-ft-eyebrow{font-size:12px;letter-spacing:.28em;text-transform:uppercase;font-weight:600;color:#bf1b2c;margin:0 0 12px}
.bk-ft{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.bk-fc{position:relative;display:block;overflow:hidden;border-radius:22px;background:#e8e2d9;color:#fff;text-decoration:none;box-shadow:0 1px 0 rgba(0,0,0,.04);transition:transform .5s cubic-bezier(.22,.61,.36,1),box-shadow .5s}
.bk-ft .bk-fc{height:380px}
.bk-fc-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.22,.61,.36,1)}
.bk-fc img{width:100%;height:100%;object-fit:cover}
@media(hover:hover){.bk-fc:hover{transform:translateY(-4px);box-shadow:0 22px 40px -22px rgba(35,31,32,.5)}.bk-fc:hover .bk-fc-img,.bk-fc:hover img{transform:scale(1.05)}}
.bk-fc-num{position:absolute;top:14px;left:14px;z-index:2;width:34px;height:34px;border-radius:50%;background:#bf1b2c;color:#fff;text-align:center;line-height:34px;font-weight:600;font-size:15px}
.bk-fc-cap{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:56px 20px 18px;background:linear-gradient(transparent,rgba(0,0,0,.62));display:flex;flex-direction:column;gap:2px}
.bk-fc-cap b{font-weight:500;font-size:19px}.bk-fc-cap span{font-size:14px;opacity:.92}
.bk-bn{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:240px 240px;gap:16px;margin-top:64px}
.bk-bn .bk-fc{border-radius:20px;height:100%}
.bk-bn .bk-fc-wide{grid-column:2/4}
.bk-fc-pill{position:absolute;left:12px;bottom:12px;z-index:2;background:#fff;color:#161314;border-radius:99px;padding:6px 14px;font-size:14px;display:flex;gap:10px}
.bk-fc-pill b{font-weight:500}
.bk-bn-intro{grid-row:1/3;background:#161314;color:#fff;border-radius:20px;padding:28px;display:flex;flex-direction:column;justify-content:space-between}
.bk-bn-intro h3{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:400;font-size:30px;line-height:1.15;margin:0}
.bk-bn-intro p{font-size:14px;line-height:1.55;opacity:.8;margin:0}
.bk-bn-intro a{align-self:flex-start;color:#fff;font-size:14px;border-bottom:1px solid #fff;padding-bottom:2px;text-decoration:none}
@media(max-width:900px){.bk-ft{grid-template-columns:1fr}.bk-ft .bk-fc{height:340px}.bk-bn{grid-template-columns:1fr 1fr;grid-template-rows:auto 220px 220px}.bk-bn-intro{grid-row:auto;grid-column:1/3;gap:14px}.bk-bn .bk-fc-wide{grid-column:1/3}}
</style>
<style>

 main [role=switch]{min-height:24px}
}
@media(max-width:640px){
 main h1{font-size:1.5rem}

}
