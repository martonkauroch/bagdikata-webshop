  <style>
.bk-ft-wrap{margin:0 0 44px}
.bk-ft-eyebrow{font-size:12px;letter-spacing:.28em;text-transform:uppercase;font-weight:600;color:#bf1b2c;margin:0 0 12px}
.bk-ft{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.bk-fc{position:relative;display:block;overflow:hidden;border-radius:22px;background:#e8e2d9;color:#fff;text-decoration:none;box-shadow:0 1px 0 rgba(0,0,0,.04);transition:transform .5s cubic-bezier(.22,.61,.36,1),box-shadow .5s}
.bk-ft .bk-fc{height:380px}
.bk-fc-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.22,.61,.36,1)}
.bk-fc img{width:100%;height:100%;object-fit:cover}
@media(hover:hover){.bk-fc:hover{transform:translateY(-4px);box-shadow:0 22px 40px -22px rgba(35,31,32,.5)}.bk-fc:hover .bk-fc-img,.bk-fc:hover img{transform:scale(1.05)}}
.bk-fc-num{position:absolute;top:14px;left:14px;z-index:2;width:34px;height:34px;border-radius:50%;background:#bf1b2c;color:#fff;text-align:center;line-height:34px;font-weight:600;font-size:15px}
.bk-fc-cap{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:56px 20px 18px;background:linear-gradient(transparent,rgba(0,0,0,.62));display:flex;flex-direction:column;gap:2px}
.bk-fc-cap b{font-weight:500;font-size:19px}.bk-fc-cap span{font-size:14px;opacity:.92}
.bk-bn{display:grid;grid-template-columns:minmax(0,.85fr) repeat(3,minmax(0,1fr));grid-template-rows:auto;gap:18px;margin-top:64px;align-items:stretch}
.bk-bn .bk-fc{border-radius:20px;height:auto;aspect-ratio:4/5}
.bk-bn .bk-fc-img,.bk-bn .bk-fc img{object-position:50% 22%}
.bk-bn .bk-fc-pill{left:0;right:0;bottom:0;max-width:none;border-radius:0;background:linear-gradient(transparent,rgba(0,0,0,.66));color:#fff;padding:56px 18px 16px;flex-direction:column;align-items:flex-start;gap:3px;font-size:14px}
.bk-bn .bk-fc-pill b{font-size:17px;font-weight:500;line-height:1.25}
.bk-bn .bk-fc-pill span{opacity:.9}
.bk-bn .bk-fc-wide{grid-column:auto}
.bk-fc-pill{position:absolute;left:12px;bottom:12px;z-index:2;background:#fff;color:#161314;border-radius:99px;padding:6px 14px;font-size:14px;display:flex;gap:10px}
.bk-fc-pill b{font-weight:500}
.bk-fc-pill{max-width:calc(100% - 24px);box-sizing:border-box;align-items:baseline;line-height:1.3}
.bk-fc-pill b{min-width:0;overflow-wrap:anywhere}
.bk-fc-pill span{white-space:nowrap}
@media(max-width:600px){.bk-fc-pill{left:10px;bottom:10px;max-width:calc(100% - 20px);flex-direction:column;align-items:flex-start;gap:1px;border-radius:14px;padding:7px 12px;font-size:13px}}
.bk-bn-intro{grid-row:auto;gap:18px;background:#161314;color:#fff;border-radius:20px;padding:28px;display:flex;flex-direction:column;justify-content:space-between}
.bk-bn-intro h3{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:400;font-size:30px;line-height:1.15;margin:0}
.bk-bn-intro p{font-size:14px;line-height:1.55;opacity:.8;margin:0}
.bk-bn-intro a{align-self:flex-start;color:#fff;font-size:14px;border-bottom:1px solid #fff;padding-bottom:2px;text-decoration:none}
@media(max-width:900px){.bk-ft{grid-template-columns:1fr}.bk-ft .bk-fc{height:340px}.bk-bn{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.bk-bn-intro{grid-column:1/-1;padding:22px}.bk-bn .bk-fc-pill{padding:40px 12px 12px}.bk-bn .bk-fc-pill b{font-size:15px}}
@media(max-width:600px){.bk-bn{grid-template-columns:repeat(2,minmax(0,1fr))}.bk-bn .bk-fc-wide{grid-column:1/-1;aspect-ratio:4/3}.bk-bn .bk-fc-pill{flex-direction:column;border-radius:0}}
.bk-live-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#10b981;box-shadow:0 0 0 0 rgba(16,185,129,.6);animation:bk-live 1.8s infinite}
@keyframes bk-live{0%{box-shadow:0 0 0 0 rgba(16,185,129,.55)}70%{box-shadow:0 0 0 9px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
@keyframes slide-zoom{0%{opacity:0;transform:scale(1.18)}to{opacity:1;transform:scale(1)}}
@keyframes slide-zoomout{0%{opacity:0;transform:scale(.82);border-radius:24px}to{opacity:1;transform:scale(1);border-radius:0}}
@keyframes slide-blur{0%{opacity:0;filter:blur(22px) saturate(1.3)}60%{opacity:1}to{opacity:1;filter:blur(0) saturate(1)}}
@keyframes slide-rise{0%{clip-path:inset(100% 0 0 0);transform:translateY(8%)}to{clip-path:inset(0);transform:translateY(0)}}
@keyframes slide-wipeleft{0%{clip-path:inset(0 100% 0 0);transform:translate(-6%)}to{clip-path:inset(0);transform:translate(0)}}
@keyframes slide-split{0%{clip-path:inset(0 50% 0 50%)}to{clip-path:inset(0 0 0 0)}}
@keyframes slide-diamond{0%{clip-path:polygon(var(--fx) var(--fy),var(--fx) var(--fy),var(--fx) var(--fy),var(--fx) var(--fy))}to{clip-path:polygon(var(--fx) calc(var(--fy) - 210%),calc(var(--fx) + 210%) var(--fy),var(--fx) calc(var(--fy) + 210%),calc(var(--fx) - 210%) var(--fy))}}
@keyframes slide-swirl{0%{opacity:0;transform:rotate(-5deg) scale(1.22)}to{opacity:1;transform:rotate(0) scale(1)}}
</style>
