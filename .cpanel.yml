---
# cPanel Git™ Version Control: „Deploy HEAD Commit” ezt futtatja.
# A repó tartalmát a public_html-be másolja (a tárhelyen nincs rsync, ezért cp/find).
# Kimarad: .git, .github, README.md, .gitignore, .cpanel.yml, az api/data (éles adatok,
# titkok – a tárhelyen lévő változat érintetlen marad) és a két teszt-PHP.
deployment:
  tasks:
    - export DEPLOYPATH=/home/bagdikat/public_html/
    - /bin/mkdir -p ${DEPLOYPATH}api ${DEPLOYPATH}assets
    - /bin/find . -maxdepth 1 -type f ! -name .gitignore ! -name .cpanel.yml ! -name README.md -exec /bin/cp -f {} $DEPLOYPATH \;
    - /bin/cp -Rf assets/. ${DEPLOYPATH}assets/
    - /bin/find api -maxdepth 1 -type f -name '*.php' ! -name mailtest.php ! -name selftest.php -exec /bin/cp -f {} ${DEPLOYPATH}api/ \;
