---
# cPanel Git™ Version Control: „Deploy HEAD Commit” ezt futtatja.
# A repó tartalmát a public_html-be másolja. Az api/data (éles adatok, titkok)
# és a teszt-PHP-k kimaradnak, a tárhelyen lévő változatuk érintetlen marad.
deployment:
  tasks:
    - export DEPLOYPATH=/home/bagdikat/public_html/
    - /usr/bin/rsync -rlt --exclude=.git --exclude=.github --exclude=.gitignore --exclude=.cpanel.yml --exclude=README.md --exclude=api/data --exclude=api/mailtest.php --exclude=api/selftest.php ./ $DEPLOYPATH
