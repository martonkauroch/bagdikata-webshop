name: Feltöltés a tárhelyre (FTPS)

on:
  # Egyelőre csak kézzel indítható (Actions → Run workflow).
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: FTP diagnosztika (ideiglenes)
        continue-on-error: true
        env:
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
          S: ${{ secrets.FTP_SERVER }}
        run: |
          echo "Felhasznalonev hossza: ${#U}, @ utani resz: '${U#*@}', szokoz a vegen: $([[ "$U" =~ [[:space:]]$ ]] && echo IGEN || echo nem)"
          echo "Szerver hossza: ${#S}"
          echo "Jelszo hossza: ${#P}, szokoz/sortores a szelen: $([[ "$P" =~ ^[[:space:]] || "$P" =~ [[:space:]]$ ]] && echo IGEN || echo nem)"
          curl -sS -v --ssl-reqd --insecure --max-time 30 -u "$U:$P" "ftp://$S/" 2>&1 | grep -E "^[<>] |^[a-z-]{10} " | grep -v PASS || true
      - name: Feltöltés
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: public_html/
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            api/data/**
            api/mailtest.php
            api/selftest.php
