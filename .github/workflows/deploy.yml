name: Feltöltés a tárhelyre (FTPS)

on:
  # Tartalék: a tárhely jelenleg tiltja a GitHub felőli FTP-t,
  # az élesítés a cPanel Git™ Version Control-lal megy (.cpanel.yml).
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Feltöltés
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: public_html/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            api/data/**
            api/mailtest.php
            api/selftest.php
